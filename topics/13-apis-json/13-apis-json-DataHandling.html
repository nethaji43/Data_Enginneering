<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APIs &amp; JSON — Data Engineering Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
<style>
  :root{ --ring-color:#39C5CF; }
  body{ background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(57,197,207,0.08), transparent), var(--bg); }
  .hero{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:8px;}

  .section{margin-top:34px; border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden;}
  .section.hidden{display:none;}
  .section-head{display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .section-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16.5px;}
  .star{color:#39C5CF; font-size:14px;}
  .section-count{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-faint); background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:3px 10px;}

  .section .note, .section .diagram{margin-left:20px; margin-right:20px;}
  .section .note:first-child{margin-top:14px;}
  .section .diagram{margin-top:14px; margin-bottom:18px;}

  .items{padding:6px 8px 16px;}
  .item{display:flex; align-items:flex-start; gap:12px; padding:9px 12px; border-radius:9px; transition:background .12s;}
  .item:hover{background:var(--surface-2);}
  .check{
    width:20px; height:20px; border-radius:6px; border:2px solid var(--border); flex-shrink:0; margin-top:1px;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--bg); cursor:default;
    transition:all .15s; background:none;
  }
  .item.done .check{background:#39C5CF; border-color:#39C5CF;}
  .item-num{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); flex-shrink:0; width:22px; margin-top:2px;}
  .item-body{flex:1; min-width:0;}
  a.item-text{font-size:14.5px; color:var(--text); text-decoration:none; transition:color .15s;}
  a.item-text:hover{color:#39C5CF;}
  .item.done .item-text{color:var(--text-dim);}
  .item-text code{font-family:'JetBrains Mono',monospace; font-size:13px; background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:1px 6px; color:#7EE787;}
  .item-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .item-tag{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:2px 7px;}
  .item.item-hidden{display:none;}

  /* Fallback in case assets/style.css doesn't have this yet */
  .item-arrow{color:var(--text-faint); font-size:11px; opacity:.55; margin-left:5px; transition:opacity .15s, color .15s;}
  a.item-text:hover .item-arrow{opacity:1; color:#39C5CF;}
</style>
</head>

<script>

    note:{type:'info', text:'This is one of the most important skills for API-based data ingestion.'}
  },
  { title:'13.14 API Rate Limits', items:[
      {t:'What is rate limiting?'}, {t:'Why APIs impose limits'}, {t:'Requests per second'},
      {t:'Requests per minute'}, {t:'`429 Too Many Requests`'}, {t:'Rate-limit headers'},
      {t:'Waiting between requests'}, {t:'Retry-after concept'}, {t:'Avoid unnecessary API calls'},

  ]},
  { title:'13.15 API Error Handling', items:[
      {t:'Network errors'}, {t:'Timeout errors'}, {t:'Connection errors'}, {t:'HTTP errors'}, {t:'Invalid JSON'},
      {t:'Missing fields'}, {t:'Authentication errors'}, {t:'Rate-limit errors'}, {t:'Server errors'},

    ], example:'Request\n   \u2193\nFailed?\n   \u2193\nWait\n   \u2193\nRetry\n   \u2193\nFailed?\n   \u2193\nIncrease delay\n   \u2193\nRetry'
  },

      {t:'Identify API endpoint'}, {t:'Read API documentation'}, {t:'Understand parameters'}, {t:'Authenticate'},
      {t:'Send request'}, {t:'Check response'}, {t:'Parse JSON'}, {t:'Extract required fields'},
      {t:'Handle pagination'}, {t:'Handle rate limits'}, {t:'Handle errors'}, {t:'Store extracted data'},
  ]},

    items:[

      {t:'Save as JSON'}, {t:'Save as Parquet'}, {t:'Preserve raw API response'},
    ], examples:[
      'import requests\nimport pandas as pd\n\nresponse = requests.get(\n    "https://api.example.com/users",\n    timeout=30\n)\n\ndata = response.json()\ndf = pd.DataFrame(data["users"])\ndf.to_parquet("users.parquet")',
      'The important workflow:\n\nAPI\n \u2193\nJSON\n \u2193\nPython\n \u2193\nPandas\n \u2193\nParquet'
    ]
  },

      {t:'API as source'}, {t:'Extract'}, {t:'Parse'}, {t:'Validate'}, {t:'Transform'}, {t:'Store'},

    items:[

// flatten with global sequential numbering (1..N) — this n is what item.html?n= refers to
let counter = 0;
SECTIONS.forEach(sec => sec.items.forEach(it => { counter++; it.n = counter; }));
const TOTAL = counter;

function mdInline(str){
  return str.replace(/`([^`]+)`/g, '<code>$1</code>');
}

let progress = deReadStore(ITEMS_KEY);
let query = '';

const NOTE_ICON = {info:'\u24D8', practice:'\u2605', warning:'\u26A0'};

function render(){
  const root = document.getElementById('sections');
  root.innerHTML = '';
  const q = query.trim().toLowerCase();

  SECTIONS.forEach(sec=>{
    const doneCount = sec.items.filter(it=>progress[it.n]).length;
    const matchingItems = sec.items.filter(it=> !q || it.t.toLowerCase().includes(q) || (it.tags||[]).some(tg=>tg.toLowerCase().includes(q)));
    const secEl = document.createElement('div');
    secEl.className = 'section' + (matchingItems.length===0 ? ' hidden' : '');

    secEl.innerHTML = `<div class="section-head">
        <span class="section-title">${sec.title}</span>
        ${sec.important ? '<span class="star" title="Very important">&#9733;</span>' : ''}
        <span class="section-count">${doneCount}/${sec.items.length}</span>
      </div>`;

    if(sec.intro){
      secEl.innerHTML += `<div class="note note-${sec.intro.type}"><span class="note-icon">${NOTE_ICON[sec.intro.type]}</span><span>${mdInline(sec.intro.text)}</span></div>`;
    }

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'items';
    sec.items.forEach(it=>{
      const isDone = !!progress[it.n];
      const visible = !q || it.t.toLowerCase().includes(q) || (it.tags||[]).some(tg=>tg.toLowerCase().includes(q));
      const row = document.createElement('div');
      row.className = 'item' + (isDone?' done':'') + (visible?'':' item-hidden');
      row.innerHTML = `
        <span class="item-num">${it.n}</span>
        <span class="check" data-n="${it.n}">${isDone?'\u2713':''}</span>
        <span class="item-body">
          <a class="item-text" href="../../item.html?topic=${CONTENT_SLUG}&n=${it.n}">${mdInline(it.t)}<span class="item-arrow">&rarr;</span></a>
          ${it.tags ? `<div class="item-tags">${it.tags.map(tg=>`<span class="item-tag">${tg}</span>`).join('')}</div>` : ''}
        </span>
      `;
      // Checkbox is display-only — progress is only set from item.html's
      // "Mark as learned" button, so no click handler here.
      itemsWrap.appendChild(row);
    });
    secEl.appendChild(itemsWrap);

    const diagrams = sec.examples || (sec.example ? [sec.example] : []);
    const renderDiagrams = ()=> diagrams.forEach(txt=>{
      const ex = document.createElement('div');
      ex.className = 'diagram';
      ex.textContent = txt;
      secEl.appendChild(ex);
    });
    const renderNote = ()=>{
      if(!sec.note) return;
      const n = document.createElement('div');
      n.className = `note note-${sec.note.type}`;
      n.innerHTML = `<span class="note-icon">${NOTE_ICON[sec.note.type]}</span><span>${mdInline(sec.note.text)}</span>`;
      n.style.marginBottom = '18px';
      secEl.appendChild(n);
    };

    // A few sections (e.g. HTTP Methods, Request Headers, Status Codes) have
    // their explanatory note BEFORE the example/diagram in the source text,
    // rather than after — noteFirst preserves that original ordering.
    if(sec.noteFirst){ renderNote(); renderDiagrams(); }
    else{ renderDiagrams(); renderNote(); }

    if(!sec.note){ secEl.style.paddingBottom = '2px'; }

    root.appendChild(secEl);
  });

  updateRing();
}

function updateRing(){
  const done = Object.keys(progress).filter(k=>progress[k]).length;
  document.getElementById('progressNum').textContent = `${done}/${TOTAL}`;
  deUpdateRing(document.getElementById('ringFill'), done, TOTAL);
}

document.getElementById('search').addEventListener('input', e=>{ query = e.target.value; render(); });

// Re-read whenever we come back from an item detail page, so a
// Completed click there is reflected here immediately.
window.addEventListener('focus', ()=>{ progress = deReadStore(ITEMS_KEY); render(); });

render();
</script>
</body>
